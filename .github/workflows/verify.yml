# Verification for the Zig package in this repository.
#
# This file is entirely this fork's. Upstream ships CI of its own, and it is not
# something this fork retargets: `README.upstream.md:3-6` carries upstream's own
# badges, one for `.github/workflows/test.yaml` in the microsoft/mimalloc
# repository and one for a Dev Azure pipeline at dev.azure.com/Daan0324/mimalloc.
# Those workflows configure CMake, run on another maintainer's accounts and
# describe another maintainer's release process. Copying them here would be
# claiming their infrastructure, and adapting them would be building a project
# upstream does not ship. So this file gates the artifacts this fork delivers.
#
# Four jobs, four different questions:
#   native     does the whole 21-unit closure compile, link and install, do the
#              behavioural tests run in both optimize modes, does the example
#              run, and does the six-target compile check close
#   cross      does the whole package compile for each of the six baseline check
#              targets, one step per target, running nothing
#   consumer   does the published module resolve from a package that did not
#              write it, and does its program run
#   provenance do the recorded upstream digests, the exact upstream file set
#              and the licence records still agree with this tree, with no
#              compiler involved
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. If a target ever does turn out to be unsupported here, the honest
# edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in FORK-NOTES.md, not to add a flag
# that hides it. Today there is no such row to assert: `refused_check_targets` in
# `build.zig` is empty, `refusalFor` returns null for every operating system,
# and `checkMatrixPartition` stops the two lists from disagreeing -- so all six
# baseline rows are compiled here and none is dropped silently. That includes
# `wasm32-wasi`, which is a row rather than a refusal because upstream ships
# `src/prim/wasi/prim.c` and `src/prim/prim.c:17-19` selects it under
# `__wasi__`.
#
# The six steps below ask for the default static delivery, and a green run of
# this file is evidence about the static delivery only. It is not evidence about
# `libmimalloc.so.3.5.3`, and this file does not pretend otherwise: it walks no
# shared-object configuration, and the shared delivery is exercised on the host
# instead, by the `sdk:build:shared` and `sdk:check:shared` devenv tasks and by
# `zig build consumer -Dlinkage=dynamic`, whose records belong in README.md and
# FORK-NOTES.md. One of those rows cannot be walked for the shared delivery at
# all: `deliveredLinkage` refuses `-Dlinkage=dynamic` on a platform with no
# dynamic linker (`build.zig:346-363`), wasm32-wasi is such a platform, and a
# shared matrix of six rows would have to spend one of them asserting a refusal
# rather than a compile.
#
# System-library mode (`-fsys=mimalloc` / `-Dsystem=true`) is deliberately not a
# step here: it needs an installed libmimalloc with its own headers and its own
# pkg-config metadata, and a stock runner has neither. It is gated locally on a
# machine that has it, and a claim about it needs that run, not this file. The
# point is sharper for this package than for most: `MI_MALLOC_OVERRIDE` is never
# defined, so nothing here replaces a process's allocator, and a "system mode"
# row could not be reached by linking this package into a test program the way
# an overriding allocator would.
#
# The full 53-platform matrix is not in this file. `cross-test`, run from the
# package root, builds and *runs* `tests.zig` for every platform in Zig 0.16.0's
# published Tier 1/2 table through this repository's own build graph, using
# `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` and its sibling helpers are a host-local tool with its own runner
# detection and its own scratch policy, not something a GitHub runner has;
# adding a job that invoked a path it does not have would fail for a reason that
# has nothing to do with this package, and wrapping that job in an availability
# check would turn a missing gate into a green one. So this file does not
# pretend to cover it and does not stand in for it: the `cross` job runs nothing,
# and a platform with no runner on the host is recorded as explicit `build_only`
# coverage, never as a pass. The command and its receipts belong in README.md
# and FORK-NOTES.md.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests, example and six-target compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The default step is the install step: the 21 C units of upstream's own
      # `mi_sources` list, the facade, the example, the pkg-config file and the
      # licence records, into zig-out/. `src/free.c` and `src/alloc-override.c`
      # are not compiled separately because `src/alloc.c:19-22` includes them,
      # and `src/static.c` is retained but not compiled because upstream compiles
      # it only as `mimalloc-obj`.
      - name: build and install
        run: zig build --summary all

      # The linked route, both optimize modes, and the second mode is not a
      # formality. `include/mimalloc/types.h:76-80` defines `MI_DEBUG` as 2
      # when neither `MI_BUILD_RELEASE` nor `NDEBUG` is defined, and as 0 when
      # NDEBUG is, and `include/mimalloc/internal.h` guards its own bodies on
      # `MI_DEBUG`, `MI_DEBUG>1` and `MI_DEBUG>2`. Debug therefore compiles
      # upstream's extensive internal invariant checking and ReleaseSafe
      # compiles none of it: the two runs are different compilations of the
      # same tests over different source, not one binary run twice.
      - name: test (Debug)
        run: zig build test --summary all

      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      # The example runs from the build tree; `zig build smoke` deliberately
      # does not depend on the install step (`build.zig:1243-1250`).
      - name: smoke
        run: zig build smoke --summary all

      # Six targets compiled, nothing run. `check` uses addTest for each target
      # so the facade's declarations are instantiated rather than left as an
      # unreferenced archive.
      - name: check
        run: zig build check --summary all

  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Six separate compile steps, six separate targets, no tolerated failure.
      # Each one compiles the whole package for that target: the 21 C units of
      # `src/` with that target's own platform macros (so a different
      # `src/prim/*/prim.c` is selected for each one), the translated
      # `mimalloc.h`, the facade, the tests and the example. Nothing is run, so a
      # green step is compile evidence and not a claim that a foreign binary
      # executed.
      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      # The Windows row is the one that turns `MI_WIN_NOREDIRECT=1` on, which is
      # upstream's own switch for not building the CRT redirection module: that
      # module needs a separate `mimalloc-redirect` DLL this package does not
      # build (`CMakeLists.txt:323-327`, `:1060`).
      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      # The sixth row, compiled like the others. `src/prim/prim.c:17-19` selects
      # `src/prim/wasi/prim.c` under `__wasi__`, so upstream ships primitives
      # for this target and `refused_check_targets` is empty; this row asserts
      # nothing about running, because a foreign target only runs if the host
      # has an executor for it.
      - name: check wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi --summary all

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      # `build.zig`'s consumer step runs the separate `consumer/` package as its
      # own `zig build`, forwarding this build's resolved target, optimize mode,
      # library mode, linkage and dispatch shape rather than the defaults it
      # would pick for itself, so the program it runs is a consumer of the
      # configuration this tree was built in.
      - name: run
        run: zig build consumer --summary all

  provenance:
    name: upstream digests, file set and licence records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Zig toolchain is installed for this job, and that is the point: the
      # three questions the checker answers -- do the vendored files still hash
      # to what UPSTREAM.sha256 records, is the vendored file set exactly that
      # set, and do the records agree with each other -- need sha256sum, grep,
      # find, awk, diff and cmp and nothing else. A provenance gate that needed
      # the compiler would not survive the compiler being broken.
      - name: provenance
        run: tools/check-provenance.sh
